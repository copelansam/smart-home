info:
  name: Create Device - Failure (Unsupported Device Type)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/devices/create-device"
  body:
    type: json
    data: |-
      {
        "name": "test bad name",
        "deviceType": "WATCH"
        "location": "test"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Should fail to load request with invalid DeviceType enum", () => {
          expect(res.status).to.equal(400);
          expect(res.body.title).to.equal("Bad Request");
          expect(res.body.detail).to.contain("Failed to read request");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
