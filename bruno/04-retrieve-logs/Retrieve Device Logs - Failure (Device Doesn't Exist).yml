info:
  name: Retrieve Device Logs - Failure (Device Doesn't Exist)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/devices/00000000-0000-0000-0000-000000000000/history"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Should throw an error if the user tries to find the logs for a device that doesn't exist", () => {
          expect(res.status).to.equal(404);
          expect(res.body.title).to.equal("Device Not Found");
          expect(res.body.detail).to.contain("A device with this ID could not be found.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
